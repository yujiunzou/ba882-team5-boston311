version: 2

models:
  - name: fct_service_requests
    description: "Unified Boston 311 service requests with resolution and SLA metrics."

    columns:
      - name: service_request_key
        data_tests:
          - not_null
          - unique

      - name: case_id
        data_tests:
          - not_null

      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Legacy', 'New']

      - name: opened_at
        data_tests:
          - not_null

